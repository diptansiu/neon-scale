<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>NEON//SCALE</title>
    <script>
      // SPA fallback: redirect unknown routes to index.html so client-side routing works on GitHub Pages.
      (function () {
        var path = window.location.pathname;
        var target = window.location.origin + window.location.pathname.replace(/\/[^\/]*$/, "/index.html");
        window.location.replace(target);
      })();
    </script>
  </head>
  <body>
    <p>Redirecting&hellip;</p>
  </body>
</html>
